services: 
  genai-vuln-prioritization:
    build: 
      context: .
    depends_on:
      postgres-db:
        condition: service_healthy
    container_name: GenAi_Vulnerability_Prioritization
    stdin_open: true
    tty: true
    command: ["python", "main.py"]
    env_file: 
      - .env
    volumes:
      - ./:/app/
      
  postgres-db:
    image: postgres
    container_name: postgres-db
    env_file: 
      - .env
    ports:
      - "5432:5432"
    volumes:
      - "postgres_data:/var/lib/postgresql"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 5s
      timeout: 3s
      retries: 3

volumes:
  postgres_data: {}
    